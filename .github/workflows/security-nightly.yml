name: Security (nightly)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  osv-scanner:
    # newly published advisories against the locked dependency tree
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: false
      scan-args: |-
        --lockfile=pnpm-lock.yaml

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-deps: 'false'
      - name: Audit dependencies
        run: |
          set +e
          pnpm audit --audit-level=moderate --json > "$RUNNER_TEMP/audit.json"
          AUDIT_STATUS=$?
          set -e
          export AUDIT_STATUS

          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const rc = Number.parseInt(process.env.AUDIT_STATUS ?? '1', 10)
          const reportPath = join(process.env.RUNNER_TEMP ?? '/tmp', 'audit.json')

          let report
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'))
          }
          catch (error) {
            console.error(`::error::pnpm audit failed before producing valid JSON (exit ${rc}): ${error.message}`)
            process.exit(rc || 1)
          }

          if (report?.error || !report?.advisories || typeof report.advisories !== 'object') {
            const msg = report?.error?.summary ?? 'missing advisories object'
            console.error(`::error::pnpm audit returned an error (exit ${rc}): ${msg}`)
            process.exit(rc || 1)
          }

          const advisories = Object.values(report.advisories)
          if (rc !== 0 && advisories.length === 0) {
            console.error(`::error::pnpm audit exited with status ${rc} without reporting advisories`)
            process.exit(rc)
          }

          const esc = v => String(v ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ')
          const lines = ['### pnpm audit (moderate+)', '']

          if (advisories.length === 0) {
            lines.push('No unignored moderate/high/critical advisories found.')
          }
          else {
            lines.push('| Severity | Package | Installed | Patched | Advisory |')
            lines.push('| --- | --- | --- | --- | --- |')
            for (const adv of advisories) {
              const versions = [...new Set((adv.findings ?? []).map(f => f.version).filter(Boolean))].join(', ') || '-'
              const ghsa = adv.github_advisory_id ?? String(adv.id ?? 'unknown')
              const advisoryLink = adv.url ? `[${esc(ghsa)}](${esc(adv.url)})` : esc(ghsa)
              lines.push(`| ${esc(adv.severity)} | ${esc(adv.module_name)} | ${esc(versions)} | ${esc(adv.patched_versions || 'none')} | ${advisoryLink} |`)
              console.log(`::warning::${adv.severity} advisory ${ghsa} in ${adv.module_name}@${versions} (patched: ${adv.patched_versions || 'none'})`)
            }
          }

          const markdown = `${lines.join('\n')}\n`
          process.stdout.write(markdown)
          if (process.env.GITHUB_STEP_SUMMARY)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown)
          EOF

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          # also query GitHub for known-vulnerable action versions
          online-audits: true

  secrets:
    # the full history, with the latest rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: gitleaks
          install-deps: 'false'
      - run: gitleaks git --no-banner --redact --exit-code 0 --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  scorecard:
    # OpenSSF Scorecard: branch protection, pinned dependencies, token permissions, …
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
