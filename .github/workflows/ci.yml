name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node pnpm actionlint zizmor
      - run: pnpm run lint
      - run: pnpm run lint:actions

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build package and example decks
        run: pnpm run build
      - name: Check the package contents
        run: |
          tar -tzf dist/slidev-theme-tum-*.tgz | sort > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          grep -q 'package/layouts/cover.vue' "$RUNNER_TEMP/files.txt"
          grep -q 'package/assets/uhrenturm.png' "$RUNNER_TEMP/files.txt"
          if grep -qE 'package/(test|node_modules|dist)/' "$RUNNER_TEMP/files.txt"; then
            echo "::error::unexpected files in the package"; exit 1
          fi
      - name: Install the package into a fresh Slidev project
        run: scripts/smoke-test-package.sh dist/slidev-theme-tum-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tgz
          retention-days: 7

  export:
    # renders every slide in Chromium: catches runtime errors the build cannot see
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: pnpm run export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-pdf
          path: dist/showcase.pdf
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python uv pipx:zensical
          install-deps: 'false'
      - run: zensical build --clean --strict

  # single required status check for branch protection
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, build, export, docs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a required job did not succeed ($RESULTS)"; exit 1; fi
          done
