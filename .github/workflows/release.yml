# Publishes a version when its tag vX.Y.Z is pushed (`mise run release` creates
# the tag and the GitHub release with release-it):
#   1. check that the tagged commit is on main
#   2. verify its SLSA source provenance (slsa-source.yml, git notes)
#   3. pack the npm tarball with the version from the tag
#   4. SLSA build track: provenance for the tarball (slsa-framework attester, Build L3)
#   5. verify that provenance, then publish to npm with trusted publishing (OIDC, npm provenance)
#   6. attach the tarball and the provenance to the GitHub release
# Run it by hand (workflow_dispatch) on main for a dry run: every step for real,
# except that npm publish runs with --dry-run and nothing is uploaded.
# See docs/development/releasing.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # keep in sync with the `uses:` refs of the slsa-framework/actions jobs below
  SLSA_ACTIONS_SHA: 3efdf6f2112b1170cb369442620788752df11bca # v0.2.0

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The commit must be on main
        id: version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} does not point to a commit on main"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=0.0.0-dry-run.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          fi

  verify-source:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A commit carries more than one source provenance when its attestation was
      # re-run (e.g. after a ruleset change); the verifier needs exactly one.
      - name: Take the newest source provenance from the commit's git note
        run: |
          git fetch --no-tags origin 'refs/notes/commits:refs/notes/commits'
          git notes show "$GITHUB_SHA" \
            | jq -c 'select((.dsseEnvelope.payload | @base64d | fromjson | .predicateType)
                == "https://github.com/slsa-framework/source-tool/source-provenance/v1")' \
            | tail -n 1 > "$RUNNER_TEMP/source.intoto.jsonl"
          test -s "$RUNNER_TEMP/source.intoto.jsonl" || { echo "::error::no source provenance for $GITHUB_SHA"; exit 1; }
      - name: Verify the SLSA source level of the commit
        uses: slsa-framework/actions/verify/source@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          attestation: ${{ runner.temp }}/source.intoto.jsonl
          subject: ${{ github.sha }}
          expected-branch: refs/heads/main
          official: true
          level: ${{ vars.SLSA_SOURCE_LEVEL || '2' }}

  build:
    needs: [check, verify-source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Set the version from the tag
        working-directory: theme
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: npm pkg set "version=${VERSION}"
      - name: Pack
        run: pnpm run build:package
      - name: Install the package into a fresh Slidev project
        run: scripts/smoke-test-package.sh dist/slidev-theme-tum-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  provenance:
    # Its own job by design: the attester attests the artifacts of `build`. It must
    # start after `build` finished; started earlier, it can find `build` still
    # queued, wait for nothing and attest no artifacts at all.
    needs: [build]
    permissions:
      id-token: write
      actions: read
      contents: read
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
    with:
      watch-jobs: build
      artifacts-filter: package
      build-from-source: false
      version: v0.1.1

  publish:
    needs: [check, build, provenance]
    runs-on: ubuntu-latest
    environment:
      # a dry run gets no environment: no deployment, no npm credentials
      name: ${{ needs.check.outputs.dry-run == 'true' && 'dry-run' || 'npm' }}
      url: https://www.npmjs.com/package/slidev-theme-tum
    permissions:
      contents: read
      id-token: write # npm trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node
          install-deps: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-attestations
          path: slsa
      - name: Locate the tarball
        id: tarball
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          file="dist/slidev-theme-tum-${VERSION}.tgz"
          test -f "$file"
          echo "path=${file}" >> "$GITHUB_OUTPUT"
      - name: Verify the build provenance before publishing
        uses: slsa-framework/actions/verify/build@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          attestation: slsa/provenance.intoto.json
          artifacts: ${{ steps.tarball.outputs.path }}
          expected-source: github.com/${{ github.repository }}
          trusted-builders: https://github.com/${{ github.repository }}/.github/workflows/release.yml
          signer: sigstore::https://token.actions.githubusercontent.com::https://github.com/slsa-framework/actions/.github/workflows/attest_actions.yml@${{ env.SLSA_ACTIONS_SHA }}
          level: 3
      - name: Publish to npm
        if: needs.check.outputs.dry-run != 'true'
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: scripts/publish-package.sh "$TARBALL" --provenance
      - name: Publish to npm (dry run)
        if: needs.check.outputs.dry-run == 'true'
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: scripts/publish-package.sh "$TARBALL" --dry-run --provenance=false --tag dry-run

  release-assets:
    needs: [check, publish]
    if: needs.check.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-attestations
          path: slsa
      - name: Attach the tarball and the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # the SLSA tools look for this asset name
          mv slsa/provenance.intoto.json attestations.intoto.jsonl
          # release-it creates the release; create it here if it does not exist (yet)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/slidev-theme-tum-${VERSION}.tgz" attestations.intoto.jsonl
