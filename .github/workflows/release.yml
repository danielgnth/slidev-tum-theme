# Runs on every push to main:
#   1. SLSA source track: provenance + VSA for the new revision, stored in git notes
# and, for a merged release PR (`chore(release): vX.Y.Z`, version not tagged yet) or a manual run:
#   2. verify the source provenance of the commit
#   3. pack the npm tarball
#   4. SLSA build track: provenance for the tarball (slsa-framework attester, Build L3)
#   5. verify that provenance, then publish to npm with trusted publishing (OIDC, npm provenance)
#   6. tag the commit and create the GitHub release with the tarball and the provenance
# See docs/development/releasing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # keep in sync with the `uses:` refs of the slsa-framework/actions jobs below
  SLSA_ACTIONS_SHA: 3efdf6f2112b1170cb369442620788752df11bca # v0.2.0

jobs:
  source-provenance:
    if: github.event_name == 'push'
    permissions:
      contents: write # stores the attestations in git notes
      id-token: write
    uses: slsa-framework/actions/.github/workflows/compute_slsa_source.yml@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this a release?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # first line of the pushed commit: a merged release PR is `chore(release): vX.Y.Z`
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(jq -r .version theme/package.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "${HEAD_COMMIT_MESSAGE%%$'\n'*}" != "chore(release): v${version}"* ]]; then
            echo "not a release commit"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --silent 2>/dev/null; then
            echo "v${version} is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} will be released"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify-source:
    needs: [source-provenance, check]
    if: >-
      !cancelled()
      && needs.check.outputs.release == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.source-provenance.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the SLSA source level of the release commit
        uses: slsa-framework/actions/verify/source@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          commit: ${{ github.sha }}
          expected-branch: refs/heads/main
          official: true
          level: ${{ vars.SLSA_SOURCE_LEVEL || '2' }}

  build:
    needs: [check, verify-source]
    if: ${{ !cancelled() && needs.verify-source.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Pack
        run: pnpm run build:package
      - name: Install the package into a fresh Slidev project
        run: scripts/smoke-test-package.sh dist/slidev-theme-tum-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  provenance:
    # runs in its own job by design: the attester waits for `build` and attests its artifacts
    needs: [check]
    if: needs.check.outputs.release == 'true'
    permissions:
      id-token: write
      actions: read
      contents: read
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
    with:
      watch-jobs: build
      artifacts-filter: package
      build-from-source: false
      version: v0.1.1

  publish:
    needs: [check, build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/slidev-theme-tum
    permissions:
      contents: read
      id-token: write # npm trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node
          install-deps: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-attestations
          path: slsa
      - name: Locate the tarball
        id: tarball
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          file="dist/slidev-theme-tum-${VERSION}.tgz"
          test -f "$file"
          echo "path=${file}" >> "$GITHUB_OUTPUT"
      - name: Verify the build provenance before publishing
        uses: slsa-framework/actions/verify/build@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          attestation: slsa/provenance.intoto.json
          artifacts: ${{ steps.tarball.outputs.path }}
          expected-source: github.com/${{ github.repository }}
          trusted-builders: https://github.com/${{ github.repository }}/.github/workflows/release.yml
          signer: sigstore::https://token.actions.githubusercontent.com::https://github.com/slsa-framework/actions/.github/workflows/attest_actions.yml@${{ env.SLSA_ACTIONS_SHA }}
          level: 3
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          npm --version
          npm publish "$TARBALL" --access public --provenance

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-attestations
          path: slsa
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # the SLSA tools look for this asset name
          mv slsa/provenance.intoto.json attestations.intoto.jsonl
          # release notes: the CHANGELOG section of this version
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ")) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v${VERSION}" > notes.md
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            "dist/slidev-theme-tum-${VERSION}.tgz" \
            attestations.intoto.jsonl
