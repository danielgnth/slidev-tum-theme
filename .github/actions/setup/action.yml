name: Setup
description: Install the pinned toolchain from mise.toml and the pnpm dependencies

inputs:
  tools:
    description: Tools from mise.toml to install (space separated), empty for all
    required: false
    default: node pnpm
  install-deps:
    description: Run pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.10
        install_args: ${{ inputs.tools }}
        cache_key_prefix: mise-${{ inputs.tools }}

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
