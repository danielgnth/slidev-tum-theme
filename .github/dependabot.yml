version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # published without the provenance of its neighbours; refused by pnpm's trustPolicy
      - dependency-name: lefthook
        versions: [2.2.2]
    groups:
      slidev:
        patterns: ['@slidev/*', playwright-chromium]
      lint:
        patterns: ['eslint*', '@antfu/eslint-config', 'stylelint*']
      release:
        patterns: [release-it, '@release-it/*', 'conventional-changelog-*']
      test:
        patterns: [vitest, '@vue/test-utils', happy-dom]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories: [/, '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
